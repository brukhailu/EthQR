<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethswitch QR Simulator</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f9; }
        .navbar { background-color: #ffffff; box-shadow: 0 2px 4px rgba(0,0,0,.04); }
        .navbar-brand { font-weight: 600; color: #0d6efd; }
        .card { border: none; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05); border-radius: 0.5rem; margin-bottom: 1.5rem; }
        .card-header { background-color: #fff; border-bottom: 1px solid #f0f0f0; font-weight: 600; padding: 1rem 1.5rem; }

        /* Unified Table Styles */
        .table-qr th { background-color: #f8f9fa; text-transform: uppercase; font-size: 0.75em; letter-spacing: 0.5px; vertical-align: middle; color: #6c757d; }
        .table-qr td { vertical-align: middle; font-size: 0.9em; }
        .tag-id { font-family: 'Courier New', monospace; font-weight: bold; color: #0d6efd; }
        .status-valid { color: #198754; font-weight: 600; }
        .status-invalid { color: #dc3545; font-weight: 600; }
        .sub-row { background-color: #fcfcfc; }
        .nested-table { margin-bottom: 0; background-color: transparent; }
        .nested-table td { border-bottom: none; padding: 0.25rem 0.5rem; }
        .badge-mandatory { background-color: #dc3545; font-size: 0.7em; }
        .badge-optional { background-color: #6c757d; font-size: 0.7em; }
        .form-control-sm { font-size: 0.9em; }
        .input-error { border-color: #dc3545; background-image: none; }
        .len-badge { font-family: monospace; font-size: 0.85em; color: #6c757d; }
        .meta-cell { color: #6c757d; font-size: 0.85em; }

        #qrImage { max-width: 250px; border: 1px solid #dee2e6; border-radius: 0.5rem; padding: 0.5rem; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1060; }
        .nav-link.active { color: #0d6efd !important; font-weight: 600; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-qrcode me-2"></i>Ethswitch QR Simulator</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="/">Generator</a></li>
                <li class="nav-item"><a class="nav-link" href="/parser">Deep Parser</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container-fluid py-4 px-4">
    <div class="row g-4">
        <!-- Left Column: Generator (Expanded) -->
        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-edit me-2 text-primary"></i>Generate QR Data</span>
                    <div class="input-group input-group-sm" style="width: auto;">
                        <select class="form-select" id="testScenario" onchange="loadScenario()">
                            <option value="">Select Test Scenario...</option>
                        </select>
                        <a href="/api/qr/scenarios" download="standard-scenarios.json" class="btn btn-outline-secondary" title="Download Scenarios">
                            <i class="fas fa-download"></i>
                        </a>
                    </div>
                </div>
                <div class="card-body p-0">
                    <!-- Scenario Description -->
                    <div id="scenarioGuideline" class="alert alert-info d-none m-3" role="alert">
                        <i class="fas fa-info-circle me-2"></i><span id="scenarioDesc"></span>
                    </div>

                    <!-- Editable Generation Table -->
                    <div class="table-responsive" style="max-height: 800px; overflow-y: auto;">
                        <table class="table table-hover table-qr mb-0" id="generationTable">
                            <thead class="table-light sticky-top" style="z-index: 10;">
                                <tr>
                                    <th style="width: 50px;">Tag</th>
                                    <th style="width: 180px;">Name</th>
                                    <th style="width: 40px;">M/O</th>
                                    <th style="width: 50px;">Type</th>
                                    <th style="width: 60px;">Max Len</th>
                                    <th style="width: 50px;">Len</th>
                                    <th>Value</th>
                                    <th style="width: 30px;"></th>
                                </tr>
                            </thead>
                            <tbody id="generationTableBody">
                                <!-- Rows generated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-white">
                    <div class="d-grid gap-2">
                        <button class="btn btn-primary btn-lg" onclick="generateQR()">
                            <i class="fas fa-qrcode me-2"></i>Generate QR Code
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Result (Compacted) -->
        <div class="col-lg-4">
            <div class="card sticky-top" style="top: 80px;">
                <div class="card-header"><i class="fas fa-image me-2 text-success"></i>Generated Result</div>
                <div class="card-body text-center">
                    <div class="mb-3" style="min-height: 250px; display: flex; align-items: center; justify-content: center; background: #f8f9fa; border-radius: 0.5rem;">
                        <img id="qrImage" src="" alt="QR Code will appear here" style="display: none;">
                        <p id="qrPlaceholder" class="text-muted">Generated QR code will appear here.</p>
                    </div>

                    <div class="text-start">
                        <label class="form-label">TLV String</label>
                        <div class="input-group">
                            <textarea class="form-control font-monospace" id="tlvOutput" rows="5" readonly style="font-size: 0.85em;"></textarea>
                            <button class="btn btn-outline-secondary" type="button" onclick="copyToClipboard()">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mt-3">
                        <a href="/parser" class="btn btn-outline-primary w-100">
                            <i class="fas fa-search me-2"></i>Analyze in Deep Parser
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container p-3" id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let tagConfig = {};
    let scenarios = [];

    window.onload = async () => {
        try {
            const [tagsResp, scenariosResp] = await Promise.all([
                fetch('/api/qr/tags'),
                fetch('/api/qr/scenarios')
            ]);
            tagConfig = await tagsResp.json();
            scenarios = await scenariosResp.json();

            const select = document.getElementById('testScenario');
            scenarios.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.text = `${s.id}. ${s.name}`;
                select.appendChild(opt);
            });

            buildGenerationTable();

        } catch (e) {
            showToast('Error loading configuration', 'danger');
            console.error(e);
        }
    };

    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const id = 'toast-' + Date.now();
        const html = `
            <div id="${id}" class="toast align-items-center text-white bg-${type} border-0" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
        const toast = new bootstrap.Toast(document.getElementById(id), { delay: 5000 });
        toast.show();
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }

    function copyToClipboard() {
        const text = document.getElementById('tlvOutput').value;
        if(text) {
            navigator.clipboard.writeText(text);
            showToast('TLV copied to clipboard', 'success');
        }
    }

    function validateTagValue(tag, value, config) {
        if (!config) return { valid: true };
        if (config.dataType) {
            if (config.dataType === 'N' && !/^\d+$/.test(value)) return { valid: false };
            if (config.dataType === 'A' && !/^[a-zA-Z\s]+$/.test(value)) return { valid: false };
            if (config.dataType === 'ANS' && !/^[\x20-\x7E]+$/.test(value)) return { valid: false };
        }
        if (config.minLength && value.length < config.minLength) return { valid: false };
        if (config.maxLength && value.length > config.maxLength) return { valid: false };
        if (config.pattern) {
            try {
                const regex = new RegExp(config.pattern);
                if (!regex.test(value)) return { valid: false };
            } catch(e) {}
        }
        return { valid: true };
    }

    function buildGenerationTable() {
        const tbody = document.getElementById('generationTableBody');
        tbody.innerHTML = '';

        const sortedTags = Object.keys(tagConfig).sort((a, b) => parseInt(a) - parseInt(b));

        sortedTags.forEach(tag => {
            const config = tagConfig[tag];
            const mo = config.mandatory ? '<span class="badge badge-mandatory">M</span>' : '<span class="badge badge-optional">O</span>';
            const type = config.dataType || '-';
            const maxLen = config.maxLength || '-';
            const inputId = `gen-input-${tag}`;
            const lenId = `gen-len-${tag}`;

            let valueHtml = '';
            let lenHtml = `<span id="${lenId}" class="len-badge">00</span>`;

            // Special handling for CRC (Tag 63)
            if (tag === '63') {
                valueHtml = `<input type="text" class="form-control form-control-sm gen-input text-muted" id="${inputId}" data-tag="${tag}" value="Auto-calculated" readonly disabled>`;
                lenHtml = '<span class="len-badge">04</span>';
            }
            else if (config.subTags && config.subTags.length > 0) {
                lenHtml = '-';
                let subTable = `<table class="table table-sm nested-table mb-0" style="width:100%"><tbody>`;
                config.subTags.forEach(st => {
                    const subMo = st.mandatory ? '<span class="badge badge-mandatory">M</span>' : '<span class="badge badge-optional">O</span>';
                    const subType = st.dataType || '-';
                    const subMaxLen = st.maxLength || '-';
                    const subInputId = `gen-input-${tag}-${st.tag}`;
                    const subLenId = `gen-len-${tag}-${st.tag}`;
                    const placeholder = st.pattern ? `Format: ${st.pattern}` : '';
                    subTable += `
                        <tr>
                            <td style="width: 40px;" class="text-muted small">${st.tag}</td>
                            <td style="width: 150px;" class="text-muted small">${st.name}</td>
                            <td style="width: 30px;">${subMo}</td>
                            <td style="width: 40px;" class="meta-cell">${subType}</td>
                            <td style="width: 50px;" class="meta-cell">${subMaxLen}</td>
                            <td style="width: 40px;"><span id="${subLenId}" class="len-badge">00</span></td>
                            <td><input type="text" class="form-control form-control-sm gen-input" id="${subInputId}" data-tag="${tag}" data-subtag="${st.tag}" placeholder="${placeholder}" oninput="validateInput(this, '${tag}', '${st.tag}'); updateLen('${subLenId}', this.value);"></td>
                            <td style="width: 25px;"><i class="fas fa-check-circle text-success d-none" id="${subInputId}-valid"></i></td>
                        </tr>
                    `;
                });
                subTable += `</tbody></table>`;
                valueHtml += `<div class="sub-tag-container">${subTable}</div>`;

            } else {
                const placeholder = config.pattern ? `Format: ${config.pattern}` : '';
                if(config.pattern && config.pattern.includes('|')) {
                     const options = config.pattern.replace(/[\^\$\(\)]/g, '').split('|');
                     valueHtml = `<select class="form-select form-select-sm gen-input" id="${inputId}" data-tag="${tag}" onchange="validateInput(this, '${tag}'); updateLen('${lenId}', this.value);">
                        <option value="">Select...</option>
                        ${options.map(o => `<option value="${o}">${o}</option>`).join('')}
                     </select>`;
                } else {
                    valueHtml = `<input type="text" class="form-control form-control-sm gen-input" id="${inputId}" data-tag="${tag}" placeholder="${placeholder}" oninput="validateInput(this, '${tag}'); updateLen('${lenId}', this.value);">`;
                }
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="tag-id">${tag}</td>
                <td>${config.name}</td>
                <td>${mo}</td>
                <td class="meta-cell">${type}</td>
                <td class="meta-cell">${maxLen}</td>
                <td>${lenHtml}</td>
                <td>${valueHtml}</td>
                <td><i class="fas fa-check-circle text-success d-none" id="${inputId}-valid"></i></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateLen(id, val) {
        const el = document.getElementById(id);
        if(el) el.textContent = val.length.toString().padStart(2, '0');
    }

    function validateInput(input, tag, subTag = null) {
        const val = input.value;
        const config = tagConfig[tag];
        const targetConfig = subTag ? config.subTags.find(s => s.tag === subTag) : config;
        const iconId = subTag ? `gen-input-${tag}-${subTag}-valid` : `gen-input-${tag}-valid`;
        const icon = document.getElementById(iconId);

        if(!val) {
            input.classList.remove('is-invalid', 'is-valid');
            if(icon) icon.classList.add('d-none');
            return;
        }

        const res = validateTagValue(tag, val, targetConfig);
        if(res.valid) {
            input.classList.remove('is-invalid');
            input.classList.add('is-valid');
            if(icon) { icon.classList.remove('d-none'); }
        } else {
            input.classList.remove('is-valid');
            input.classList.add('is-invalid');
            if(icon) icon.classList.add('d-none');
        }
    }

    function loadScenario() {
        const id = parseInt(document.getElementById('testScenario').value);
        const scenario = scenarios.find(s => s.id === id);

        document.querySelectorAll('.gen-input').forEach(i => {
            // Skip CRC field which is disabled/readonly
            if(i.id === 'gen-input-63') return;

            i.value = '';
            i.classList.remove('is-valid', 'is-invalid');
            const lenId = i.id.replace('gen-input', 'gen-len');
            updateLen(lenId, '');
        });
        document.querySelectorAll('.fa-check-circle').forEach(i => i.classList.add('d-none'));

        if (!scenario) {
            document.getElementById('scenarioGuideline').classList.add('d-none');
            return;
        }

        document.getElementById('scenarioGuideline').classList.remove('d-none');
        document.getElementById('scenarioDesc').textContent = scenario.desc || scenario.name;

        const d = scenario.data;

        const setAndTrigger = (el, val, tag, subTag=null) => {
            if(el) {
                el.value = val;
                validateInput(el, tag, subTag);
                const lenId = el.id.replace('gen-input', 'gen-len');
                updateLen(lenId, val);
            }
        };

        for (const [tag, config] of Object.entries(tagConfig)) {
            // Skip CRC auto-population
            if(tag === '63') continue;

            const field = config.dataField;

            if (field && d[field] !== undefined) {
                if (typeof d[field] !== 'object') {
                    const el = document.getElementById(`gen-input-${tag}`);
                    setAndTrigger(el, d[field], tag);
                }
                else if (config.container) {
                    const val = d[field][tag];
                    if (val) {
                        if (typeof val === 'object') {
                            config.subTags.forEach(st => {
                                if (val[st.tag]) {
                                    const el = document.getElementById(`gen-input-${tag}-${st.tag}`);
                                    setAndTrigger(el, val[st.tag], tag, st.tag);
                                }
                            });
                        } else if (config.subTags && config.delimiter) {
                            let delim = config.delimiter; if(delim === '\\|') delim = '|';
                            const parts = val.split(delim);
                            config.subTags.forEach((st, idx) => {
                                if (idx < parts.length) {
                                    const el = document.getElementById(`gen-input-${tag}-${st.tag}`);
                                    setAndTrigger(el, parts[idx], tag, st.tag);
                                }
                            });
                        } else {
                            const el = document.getElementById(`gen-input-${tag}`);
                            setAndTrigger(el, val, tag);
                        }
                    }
                }
            }

            if (config.dataField === 'additionalDataField' && d.additionalDataField) {
                if (config.subTags) {
                    config.subTags.forEach(st => {
                        if (d.additionalDataField[st.tag]) {
                            const el = document.getElementById(`gen-input-${tag}-${st.tag}`);
                            setAndTrigger(el, d.additionalDataField[st.tag], tag, st.tag);
                        }
                    });
                }
            }

            if (config.dataField === 'merchantInformationLanguageTemplate' && d.merchantInformationLanguageTemplate) {
                if (config.subTags) {
                    config.subTags.forEach(st => {
                        if (d.merchantInformationLanguageTemplate[st.tag]) {
                            const el = document.getElementById(`gen-input-${tag}-${st.tag}`);
                            setAndTrigger(el, d.merchantInformationLanguageTemplate[st.tag], tag, st.tag);
                        }
                    });
                }
            }

            if (config.dataField === 'unreservedTemplates' && d.unreservedTemplates) {
                if (d.unreservedTemplates[tag]) {
                    const tagData = d.unreservedTemplates[tag];
                    if (config.subTags) {
                        config.subTags.forEach(st => {
                            if (tagData[st.tag]) {
                                const el = document.getElementById(`gen-input-${tag}-${st.tag}`);
                                setAndTrigger(el, tagData[st.tag], tag, st.tag);
                            }
                        });
                    }
                }
            }

            if (tag === '28' && d.merchantId) {
                 if (config.subTags && config.delimiter) {
                    let delim = config.delimiter; if(delim === '\\|') delim = '|';
                    const parts = d.merchantId.split(delim);
                    config.subTags.forEach((st, idx) => {
                        if (idx < parts.length) {
                            const el = document.getElementById(`gen-input-${tag}-${st.tag}`);
                            setAndTrigger(el, parts[idx], tag, st.tag);
                        }
                    });
                }
            }
        }
    }

    async function generateQR() {
        const payload = {
            merchantAccountInformation: {},
            additionalDataField: {},
            merchantInformationLanguageTemplate: {},
            unreservedTemplates: {}
        };

        for (const [tag, config] of Object.entries(tagConfig)) {
            // Skip CRC
            if(tag === '63') continue;

            const field = config.dataField;

            if (config.subTags && config.subTags.length > 0) {
                let anyFilled = false;

                if (config.delimiter) {
                    let delim = config.delimiter; if(delim === '\\|') delim = '|';
                    const orderedValues = [];
                    config.subTags.forEach(st => {
                        const el = document.getElementById(`gen-input-${tag}-${st.tag}`);
                        const v = el ? el.value : '';
                        orderedValues.push(v);
                        if(v) anyFilled = true;
                    });

                    if (anyFilled) {
                        const valStr = orderedValues.join(delim);
                        if (config.container) {
                            payload.merchantAccountInformation[tag] = valStr;
                        }
                    }
                }
                else {
                    const subMap = {};
                    config.subTags.forEach(st => {
                        const el = document.getElementById(`gen-input-${tag}-${st.tag}`);
                        if(el && el.value) {
                            subMap[st.tag] = el.value;
                            anyFilled = true;
                        }
                    });

                    if (anyFilled) {
                        if (field === 'additionalDataField') payload.additionalDataField = subMap;
                        else if (field === 'merchantInformationLanguageTemplate') payload.merchantInformationLanguageTemplate = subMap;
                        else if (field === 'unreservedTemplates') payload.unreservedTemplates[tag] = subMap;
                        else if (config.container) payload.merchantAccountInformation[tag] = subMap;
                    }
                }
            }
            else {
                const el = document.getElementById(`gen-input-${tag}`);
                if (el && el.value) {
                    if (config.container) {
                        payload.merchantAccountInformation[tag] = el.value;
                    } else if (field) {
                        payload[field] = el.value;
                    }
                }
            }
        }

        try {
            const strResp = await fetch('/api/qr/generate-string', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(!strResp.ok) throw new Error((await strResp.json()).error || 'Generation failed');

            const tlv = await strResp.text();
            document.getElementById('tlvOutput').value = tlv;

            const imgResp = await fetch('/api/qr/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(!imgResp.ok) throw new Error('Image generation failed');

            const blob = await imgResp.blob();
            document.getElementById('qrImage').src = URL.createObjectURL(blob);
            document.getElementById('qrImage').style.display = 'block';
            document.getElementById('qrPlaceholder').style.display = 'none';

            showToast('QR Code Generated Successfully', 'success');

        } catch (e) {
            showToast(e.message, 'danger');
        }
    }
</script>
</body>
</html>

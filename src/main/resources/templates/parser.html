<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Ethswitch QR - Deep Parser')}">
</head>
<style>
    /* Page Specific Styles */
    .card { border: none; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05); border-radius: 0.5rem; margin-bottom: 1.5rem; }
    .card-header { background-color: #fff; border-bottom: 1px solid #f0f0f0; font-weight: 600; padding: 1rem 1.5rem; }
    .table-parsed { font-size: 0.9em; }
    .table-parsed th { background-color: #f8f9fa; text-transform: uppercase; font-size: 0.8em; letter-spacing: 0.5px; }
    .tag-id { font-family: 'Courier New', monospace; font-weight: bold; color: #0d6efd; }
    .status-valid { color: #198754; }
    .status-invalid { color: #dc3545; }
    .sub-row { background-color: #fcfcfc; }
    .nested-table { margin-bottom: 0; background-color: transparent; }
    .nested-table td { border-bottom: none; padding: 0.25rem 0.5rem; }
    .badge-mandatory { background-color: #dc3545; font-size: 0.7em; }
    .badge-optional { background-color: #6c757d; font-size: 0.7em; }
    #uploadedImagePreview { max-width: 200px; max-height: 200px; border-radius: 0.25rem; border: 1px solid #dee2e6; }
    .toast-container { position: fixed; top: 80px; right: 20px; z-index: 2000; }
    .comparison-missing-row { background-color: #f8d7da; border-left: 4px solid #dc3545; }
    .comparison-mismatch-row { background-color: #fff3cd; }
    .expected-val { font-size: 0.85em; color: #666; font-style: italic; display: block; margin-top: 2px; }
    .badge-dynamic { background-color: #0dcaf0; color: #000; }

    /* Drag and Drop Zone */
    .drop-zone {
        border: 2px dashed #ccc;
        border-radius: 10px;
        padding: 40px;
        text-align: center;
        transition: all 0.3s ease;
        cursor: pointer;
        background-color: #fdfdfd;
        position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
        border-color: #0d6efd;
        background-color: #f1f8ff;
    }
    .drop-zone i {
        font-size: 3rem;
        color: #adb5bd;
        margin-bottom: 15px;
    }
    .drop-zone p {
        margin: 0;
        color: #6c757d;
        font-weight: 500;
    }
    .drop-zone input[type="file"] {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        opacity: 0;
        cursor: pointer;
    }

    .iso-path-info { color: #0dcaf0; cursor: pointer; font-size: 0.8rem; margin-left: 5px; }

    /* Popover Styling */
    .iso-popover { max-width: 400px !important; }
    .iso-popover-title { background-color: #0d6efd; color: white; font-weight: bold; font-size: 0.85rem; padding: 10px 15px; border-top-left-radius: .3rem; border-top-right-radius: .3rem; }
    .iso-popover-content { padding: 0; background: #212529; color: #f8f9fa; border-bottom-left-radius: .3rem; border-bottom-right-radius: .3rem; overflow: hidden; }
    .iso-popover-header { padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); }
    .iso-popover-header code { color: #0dcaf0; font-size: 0.75rem; word-break: break-all; }
    .iso-popover-body { padding: 10px 15px; position: relative; }
    .iso-popover-body pre { margin: 0; font-size: 0.75rem; color: #e9ecef; }
    .iso-copy-btn { position: absolute; top: 10px; right: 10px; padding: 2px 6px; font-size: 0.7rem; opacity: 0.7; transition: opacity 0.2s; }
    .iso-copy-btn:hover { opacity: 1; color: #fff; border-color: #fff; }
</style>
<body>

<nav th:replace="~{fragments/layout :: header(activeTab='parser')}"></nav>

<main>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card">
                    <div class="card-header"><i class="fas fa-search me-2 text-primary"></i>Deep Parser & Validator</div>
                    <div class="card-body">

                        <ul class="nav nav-tabs mb-3" id="parserTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="text-tab" data-bs-toggle="tab" data-bs-target="#text-pane" type="button">Text Input</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="image-tab" data-bs-toggle="tab" data-bs-target="#image-pane" type="button">Image Upload</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="parserTabsContent">
                            <!-- Text Input Pane -->
                            <div class="tab-pane fade show active" id="text-pane" role="tabpanel">
                                <div class="mb-3">
                                    <label class="form-label">TLV String</label>
                                    <textarea class="form-control font-monospace" id="tlvInput" rows="4" placeholder="Paste TLV data here..."></textarea>
                                </div>
                                <div class="d-grid">
                                    <button class="btn btn-primary" onclick="parseQR()"><i class="fas fa-play me-2"></i>Parse Text</button>
                                </div>
                            </div>

                            <!-- Image Input Pane with Drag & Drop -->
                            <div class="tab-pane fade" id="image-pane" role="tabpanel">
                                <div class="row">
                                    <div class="col-md-5 mb-3 text-center d-flex align-items-center justify-content-center bg-light rounded" style="min-height: 250px;">
                                        <div>
                                            <img id="uploadedImagePreview" src="" alt="Preview" style="display:none;" class="img-fluid mb-2">
                                            <p id="imagePlaceholder" class="text-muted small m-0">Image Preview</p>
                                        </div>
                                    </div>
                                    <div class="col-md-7">

                                        <div class="drop-zone" id="dropZone">
                                            <i class="fas fa-cloud-upload-alt"></i>
                                            <p>Drag & Drop QR Image Here</p>
                                            <small class="text-muted d-block mt-1">or click to browse</small>
                                            <input type="file" id="qrFileInput" accept="image/*" onchange="handleFiles(this.files)">
                                        </div>

                                        <div class="mt-3">
                                            <label class="form-label">Decoded TLV String</label>
                                            <textarea class="form-control font-monospace" id="decodedTlvOutput" rows="3" readonly></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Comparison Section -->
                    <div id="comparisonSection" class="mt-4 p-3 bg-light rounded" style="display: none;">
                        <h5 class="mb-3"><i class="fas fa-balance-scale me-2"></i>Compare with Scenario</h5>
                        <div class="input-group">
                            <select class="form-select" id="scenarioSelect">
                                <option value="" selected>Choose a scenario to compare...</option>
                            </select>
                            <button class="btn btn-info" type="button" onclick="compareWithScenario()"><i class="fas fa-exchange-alt me-2"></i>Compare</button>
                        </div>
                    </div>

                    <!-- Results Section -->
                    <div class="mt-4">
                        <h5 class="mb-3"><i class="fas fa-list-ul me-2"></i>Parsed Results</h5>
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover table-parsed" id="parsedTable">
                                <thead class="table-light">
                                <tr>
                                    <th style="width: 5%;">Tag</th>
                                    <th style="width: 25%;">Name</th>
                                    <th style="width: 5%;">M/O</th>
                                    <th style="width: 5%;">Len</th>
                                    <th style="width: 30%;">Value</th>
                                    <th style="width: 15%;">Validation</th>
                                    <th style="width: 15%;">Comparison</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr><td colspan="7" class="text-center text-muted py-4">No data parsed yet.</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="missingTagsContainer" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<div class="toast-container p-3" id="toastContainer"></div>

<div th:replace="~{fragments/layout :: scripts}"></div>

<script>
    let tagConfig = {};
    let scenarios = [];
    let lastParsedData = null;
    let lastRawTlv = "";

    const staticTags = ['00', '53', '58'];

    window.onload = async () => {
        try {
            const [tagsResp, scenariosResp] = await Promise.all([
                fetch('/api/qr/tags'),
                fetch('/api/qr/scenarios')
            ]);
            tagConfig = await tagsResp.json();
            scenarios = await scenariosResp.json();

            const select = document.getElementById('scenarioSelect');
            scenarios.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.text = `${s.id}. ${s.name}`;
                select.appendChild(opt);
            });

            const autoParseTlv = sessionStorage.getItem('autoParseTlv');
            if (autoParseTlv) {
                sessionStorage.removeItem('autoParseTlv');
                document.getElementById('tlvInput').value = autoParseTlv;
                parseQR();
            }

            setupDragAndDrop();

        } catch (e) {
            showToast('Error loading configuration', 'danger');
        }
    };

    function setupDragAndDrop() {
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('qrFileInput');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-over'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-over'), false);
        });

        dropZone.addEventListener('drop', handleDrop, false);
    }

    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        handleFiles(files);
    }

    function handleFiles(files) {
        if (files.length > 0) {
            const file = files[0];
            if (file.type.startsWith('image/')) {
                displayImagePreview(file);
                parseImageBlob(file);
            } else {
                showToast("Please upload a valid image file", "warning");
            }
        }
    }

    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const id = 'toast-' + Date.now();
        const html = `
            <div id="${id}" class="toast align-items-center text-white bg-${type} border-0" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
        const toastEl = document.getElementById(id);
        const toast = new bootstrap.Toast(toastEl, { delay: 5000 });
        toast.show();
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }

    function validateTagValue(tag, value, config) {
        if (tag === '63' && lastRawTlv) {
            const dataToHash = lastRawTlv.substring(0, lastRawTlv.length - 4);
            const calc = calculateCRC(dataToHash);
            if (calc.toUpperCase() === value.toUpperCase()) {
                return { valid: true, msg: "Integrity OK" };
            } else {
                return { valid: false, msg: `Invalid Checksum (Calc: ${calc})` };
            }
        }

        if (!config) return { valid: true, msg: "Unknown tag" };
        if (config.dataType) {
            if (config.dataType === 'N' && !/^\d+$/.test(value)) return { valid: false, msg: "Must be Numeric" };
            if (config.dataType === 'A' && !/^[a-zA-Z\s]+$/.test(value)) return { valid: false, msg: "Must be Alphabetic" };
            if (config.dataType === 'ANS' && !/^[\x20-\x7E]+$/.test(value)) return { valid: false, msg: "Invalid chars" };
        }
        if (config.minLength && value.length < config.minLength) return { valid: false, msg: `Too short (min ${config.minLength})` };
        if (config.maxLength && value.length > config.maxLength) return { valid: false, msg: `Too long (max ${config.maxLength})` };
        if (config.pattern) {
            try {
                const regex = new RegExp(config.pattern);
                if (!regex.test(value)) return { valid: false, msg: "Format mismatch" };
            } catch(e) { console.error("Invalid regex", config.pattern); }
        }
        return { valid: true, msg: "Correct" };
    }

    async function parseQR() {
        const tlv = document.getElementById('tlvInput').value.trim();
        if(!tlv) return showToast('Please enter a TLV string', 'warning');
        try {
            const resp = await fetch('/api/qr/parse', {
                method: 'POST', headers: {'Content-Type': 'text/plain'}, body: tlv
            });
            if(!resp.ok) throw new Error((await resp.json()).error || 'Parsing failed');
            const data = await resp.json();
            lastParsedData = data;
            lastRawTlv = tlv;
            renderParsedTable(lastParsedData);
            showToast('Parsed successfully', 'success');
        } catch (e) { showToast(e.message, 'danger'); }
    }

    async function parseImageBlob(blob) {
        const formData = new FormData();
        formData.append('file', blob);
        try {
            const resp = await fetch('/api/qr/parse-image', { method: 'POST', body: formData });
            if(!resp.ok) throw new Error((await resp.json()).error || 'Parsing failed');
            const data = await resp.json();
            document.getElementById('tlvInput').value = data.raw;
            document.getElementById('decodedTlvOutput').value = data.raw;
            lastParsedData = data.parsed;
            lastRawTlv = data.raw;
            renderParsedTable(lastParsedData);
            showToast('Image parsed', 'success');
        } catch (e) { showToast(e.message, 'danger'); }
    }

    function displayImagePreview(blob) {
        const reader = new FileReader();
        reader.onload = e => {
            const img = document.getElementById('uploadedImagePreview');
            img.src = e.target.result;
            img.style.display = 'block';
            document.getElementById('imagePlaceholder').style.display = 'none';
        };
        reader.readAsDataURL(blob);
    }

    function compareWithScenario() {
        const scenarioId = document.getElementById('scenarioSelect').value;
        if (!scenarioId || !lastParsedData) {
            showToast('Please parse a QR code first and select a scenario.', 'warning');
            return;
        }
        const scenario = scenarios.find(s => s.id == scenarioId);
        if (scenario) {
            const scenarioTlv = generateScenarioTLV(scenario.data);
            const calculatedCrc = calculateCRC(scenarioTlv.substring(0, scenarioTlv.length - 4));

            const comparisonData = JSON.parse(JSON.stringify(scenario.data));
            comparisonData.crc = calculatedCrc;

            renderParsedTable(lastParsedData, comparisonData);
            showToast(`Comparing with: ${scenario.name}`, 'info');
        }
    }

    function generateScenarioTLV(scenarioData) {
        let tlv = "";
        const sortedKeys = Object.keys(tagConfig).sort((a, b) => parseInt(a) - parseInt(b));

        for (const tag of sortedKeys) {
            if (tag === '63') continue;

            const config = tagConfig[tag];
            const val = getExpectedValue(tag, config, scenarioData);

            if (val === undefined || val === null || val === "") continue;

            let stringVal = "";

            if (typeof val === 'object') {
                if (config.delimiter) {
                    if (config.subTags) {
                        const parts = config.subTags.map(st => val[st.tag] || "");
                        let delim = config.delimiter;
                        if(delim === '\\|') delim = '|';
                        stringVal = parts.join(delim);
                    }
                } else {
                    const subKeys = Object.keys(val).sort((a,b) => parseInt(a)-parseInt(b));
                    for(const st of subKeys) {
                        const sv = val[st];
                        if(sv) {
                            stringVal += st + sv.length.toString().padStart(2, '0') + sv;
                        }
                    }
                }
            } else {
                stringVal = String(val);
            }

            if(stringVal) {
                tlv += tag + stringVal.length.toString().padStart(2, '0') + stringVal;
            }
        }

        tlv += "6304";
        return tlv;
    }

    function calculateCRC(str) {
        let crc = 0xFFFF;
        const polynomial = 0x1021;
        const bytes = [];
        for (let i = 0; i < str.length; i++) {
            let code = str.charCodeAt(i);
            if (code < 0x80) bytes.push(code);
            else if (code < 0x800) bytes.push(0xc0 | (code >> 6), 0x80 | (code & 0x3f));
            else if (code < 0xd800 || code >= 0xe000) bytes.push(0xe0 | (code >> 12), 0x80 | ((code >> 6) & 0x3f), 0x80 | (code & 0x3f));
            else {
                i++;
                code = 0x10000 + (((code & 0x3ff) << 10) | (str.charCodeAt(i) & 0x3ff));
                bytes.push(0xf0 | (code >> 18), 0x80 | ((code >> 12) & 0x3f), 0x80 | ((code >> 6) & 0x3f), 0x80 | (code & 0x3f));
            }
        }

        for (let b of bytes) {
            for (let j = 0; j < 8; j++) {
                const bit = ((b >> (7 - j) & 1) === 1);
                const c15 = ((crc >> 15 & 1) === 1);
                crc <<= 1;
                if (c15 ^ bit) crc ^= polynomial;
            }
        }
        crc &= 0xFFFF;
        return crc.toString(16).toUpperCase().padStart(4, '0');
    }

    function getExpectedValue(tag, config, comparisonData) {
        if (!config || !comparisonData) return undefined;
        const field = config.dataField;
        if (!field) return undefined;

        if (tag === '63') return comparisonData.crc;

        if (config.container) {
            return comparisonData[field] ? comparisonData[field][tag] : undefined;
        } else if (field === 'unreservedTemplates') {
            return comparisonData[field] ? comparisonData[field][tag] : undefined;
        } else {
            return comparisonData[field];
        }
    }

    function escapeHtml(text) {
        if (!text) return "";
        return text.replace(/&/g, "&amp;")
                   .replace(/</g, "&lt;")
                   .replace(/>/g, "&gt;")
                   .replace(/"/g, "&quot;")
                   .replace(/'/g, "&#039;");
    }

    function getIsoTooltip(config, tag, value) {
        if (!config.isoPath) return "";

        let xml = config.isoExample || "";
        if (value && xml) {
            const placeholderMatch = xml.match(/>([^<]+)<\//);
            if (placeholderMatch) {
                xml = xml.replace(placeholderMatch[1], value);
            }
        }

        return `
            <div class="iso-popover-content">
                <div class="iso-popover-header"><code>${config.isoPath}</code></div>
                <div class="iso-popover-body">
                    <button class="btn btn-outline-light btn-sm iso-copy-btn" onclick="navigator.clipboard.writeText('${xml.replace(/\n/g, '\\n').replace(/'/g, "\\'")}');">
                        <i class="fas fa-copy"></i>
                    </button>
                    <pre>${escapeHtml(xml)}</pre>
                </div>
            </div>
        `;
    }

    function showIsoPopover(el, tag, subTag = null, value = "") {
        const config = subTag ? tagConfig[tag].subTags.find(s => s.tag === subTag) : tagConfig[tag];

        const existing = bootstrap.Popover.getInstance(el);
        if (existing) { existing.dispose(); }

        const popover = new bootstrap.Popover(el, {
            container: 'body',
            html: true,
            title: `<div class="iso-popover-title">ISO 20022 Mapping</div>`,
            content: getIsoTooltip(config, tag, value),
            trigger: 'click',
            placement: 'right',
            customClass: 'iso-popover'
        });
        popover.show();

        const closeHandler = (e) => {
            if (!el.contains(e.target) && !document.querySelector('.iso-popover')?.contains(e.target)) {
                popover.hide();
                document.removeEventListener('click', closeHandler);
            }
        };
        setTimeout(() => document.addEventListener('click', closeHandler), 100);
    }

    function renderParsedTable(data, comparisonData = null) {
        const tbody = document.querySelector('#parsedTable tbody');
        tbody.innerHTML = '';
        const missingContainer = document.getElementById('missingTagsContainer');
        missingContainer.innerHTML = '';
        document.getElementById('comparisonSection').style.display = 'block';

        if (Object.keys(data).length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-3">No data found.</td></tr>';
            return;
        }
        const sortedKeys = Object.keys(data).sort((a, b) => parseInt(a) - parseInt(b));

        for (const tag of sortedKeys) {
            const val = data[tag];
            const config = tagConfig[tag];
            const name = config ? config.name : 'Unknown';
            const mo = (config && config.mandatory) ? '<span class="badge badge-mandatory">M</span>' : '<span class="badge badge-optional">O</span>';

            const createIsoPathIcon = (conf, t, st = null, v = "") => {
                if (!conf || !conf.isoPath) return '';
                return `<i class="fas fa-info-circle iso-path-info" onclick="showIsoPopover(this, '${t}', ${st ? `'${st}'` : 'null'}, '${v}')"></i>`;
            };

            let comparisonHtml = '';
            let expectedVal = undefined;

            if (comparisonData) {
                expectedVal = getExpectedValue(tag, config, comparisonData);
            }

            if (typeof val === 'object' && val !== null) {
                if (comparisonData && expectedVal === undefined) {
                     comparisonHtml = '<span class="badge bg-info text-dark">Extra Tag</span>';
                }

                const row = document.createElement('tr');
                row.innerHTML = `<td class="tag-id">${tag}</td><td><strong>${name}</strong> ${createIsoPathIcon(config, tag)}</td><td>${mo}</td><td>-</td><td class="text-muted">Sub-tags container</td><td><span class="badge bg-secondary">Container</span></td><td>${comparisonHtml}</td>`;
                tbody.appendChild(row);

                const subRow = document.createElement('tr');
                subRow.className = 'sub-row';
                const subTd = document.createElement('td');
                subTd.colSpan = 7;
                const subTable = document.createElement('table');
                subTable.className = 'table table-sm nested-table';

                const sortedSubKeys = Object.keys(val).sort();

                sortedSubKeys.forEach(subTag => {
                    const subVal = val[subTag];
                    const subConfig = config && config.subTags ? config.subTags.find(s => s.tag === subTag) : null;
                    const subName = subConfig ? subConfig.name : 'Unknown';
                    const subMo = (subConfig && subConfig.mandatory) ? '<span class="badge badge-mandatory">M</span>' : '<span class="badge badge-optional">O</span>';
                    const validation = validateTagValue(subTag, subVal, subConfig);
                    const icon = validation.valid ? '<i class="fas fa-check-circle status-valid"></i>' : '<i class="fas fa-times-circle status-invalid"></i>';

                    let subComparisonHtml = '';
                    if (comparisonData && expectedVal) {
                        const expectedSub = expectedVal[subTag];
                        const isStatic = staticTags.includes(tag);

                        if (expectedSub === undefined) {
                            subComparisonHtml = '<span class="badge bg-info text-dark">Extra Sub-Tag</span>';
                        } else {
                            let displayVal = subVal;
                            let displayExp = expectedSub;
                            if (subConfig && subConfig.options) {
                                const opt = subConfig.options.find(o => o.value === subVal);
                                if (opt) displayVal = opt.label;
                                const optExp = subConfig.options.find(o => o.value === expectedSub);
                                if (optExp) displayExp = optExp.label;
                            }

                            if (String(expectedSub) === String(subVal)) {
                                subComparisonHtml = '<span class="badge bg-success">Match</span>';
                            } else if (!isStatic) {
                                subComparisonHtml = `<span class="badge badge-dynamic">Dynamic Value</span> <span class="expected-val text-muted">e.g. ${displayExp}</span>`;
                            } else {
                                subComparisonHtml = `<span class="badge bg-warning text-dark">Mismatch</span><span class="expected-val">Exp: ${displayExp}</span>`;
                            }
                        }
                    }

                    let valueToDisplay = subVal;
                    if (subConfig && subConfig.options) {
                        const opt = subConfig.options.find(o => o.value === subVal);
                        if (opt) valueToDisplay = `<span title="${subVal}">${opt.label}</span>`;
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="width: 40px;" class="tag-id ps-4">${subTag}</td>
                        <td style="width: 220px;">${subName} ${createIsoPathIcon(subConfig, tag, subTag, subVal)}</td>
                        <td style="width: 40px;">${subMo}</td>
                        <td style="width: 50px;">${subVal.length}</td>
                        <td class="text-break font-monospace small">${valueToDisplay}</td>
                        <td style="width: 140px;">${icon} <span class="small text-muted">${validation.valid ? 'Correct' : validation.msg}</span></td>
                        <td>${subComparisonHtml}</td>
                    `;
                    subTable.appendChild(tr);
                });

                if (comparisonData && expectedVal && typeof expectedVal === 'object') {
                    for (const [expSubTag, expSubVal] of Object.entries(expectedVal)) {
                        if (!val.hasOwnProperty(expSubTag)) {
                             const subConfig = config && config.subTags ? config.subTags.find(s => s.tag === expSubTag) : null;
                             const expSubName = subConfig ? subConfig.name : 'Unknown';
                             let displayExp = expSubVal;
                             if(subConfig && subConfig.options) {
                                 const opt = subConfig.options.find(o => o.value === expSubVal);
                                 if(opt) displayExp = opt.label;
                             }
                             const tr = document.createElement('tr');
                             tr.className = 'comparison-missing-row';
                             tr.innerHTML = `
                                <td style="width: 40px;" class="tag-id ps-4">${expSubTag}</td>
                                <td style="width: 220px;">${expSubName}</td>
                                <td style="width: 40px;">-</td>
                                <td>-</td>
                                <td class="text-muted small">Missing (Exp: ${displayExp})</td>
                                <td></td>
                                <td><span class="badge bg-danger">Missing</span></td>
                             `;
                             subTable.appendChild(tr);
                        }
                    }
                }

                subTd.appendChild(subTable);
                subRow.appendChild(subTd);
                tbody.appendChild(subRow);
            } else {
                const validation = validateTagValue(tag, val, config);
                const icon = validation.valid ? '<i class="fas fa-check-circle status-valid"></i>' : '<i class="fas fa-times-circle status-invalid"></i>';

                if (comparisonData) {
                    if (tag === '63') {
                        if (validation.valid) {
                            comparisonHtml = '<span class="badge bg-success">Valid</span>';
                        } else {
                            comparisonHtml = `<span class="badge bg-danger">Invalid</span>`;
                        }
                    } else {
                        if (expectedVal === undefined) {
                            comparisonHtml = '<span class="badge bg-info text-dark">Extra Tag</span>';
                        } else {
                            let displayVal = val;
                            let displayExp = expectedVal;
                            if(config && config.options) {
                                const opt = config.options.find(o => o.value === val);
                                if(opt) displayVal = opt.label;
                                const optExp = config.options.find(o => o.value === expectedVal);
                                if(optExp) displayExp = optExp.label;
                            }

                            if (String(expectedVal) === String(val)) {
                                comparisonHtml = '<span class="badge bg-success">Match</span>';
                            } else if (!staticTags.includes(tag)) {
                                comparisonHtml = `<span class="badge badge-dynamic">Dynamic Value</span> <span class="expected-val text-muted">e.g. ${displayExp}</span>`;
                            } else {
                                comparisonHtml = `<span class="badge bg-warning text-dark">Mismatch</span><span class="expected-val">Exp: ${displayExp}</span>`;
                            }
                        }
                    }
                }

                let valueToDisplay = val;
                if(config && config.options) {
                    const opt = config.options.find(o => o.value === val);
                    if(opt) valueToDisplay = `<span title="${val}">${opt.label}</span>`;
                }

                const row = document.createElement('tr');
                if (comparisonData && expectedVal !== undefined && String(expectedVal) !== String(val) && staticTags.includes(tag) && tag !== '63') {
                    row.className = 'comparison-mismatch-row';
                }

                row.innerHTML = `
                    <td class="tag-id">${tag}</td>
                    <td>${name} ${createIsoPathIcon(config, tag, null, val)}</td>
                    <td>${mo}</td>
                    <td>${val.length}</td>
                    <td class="text-break font-monospace small">${valueToDisplay}</td>
                    <td>${icon} <span class="small text-muted">${validation.valid ? 'Correct' : validation.msg}</span></td>
                    <td>${comparisonHtml}</td>
                `;
                tbody.appendChild(row);
            }
        }

        if (comparisonData) {
            const missingList = [];
            for (const [tag, config] of Object.entries(tagConfig)) {
                const expVal = getExpectedValue(tag, config, comparisonData);
                if (expVal !== undefined && !data.hasOwnProperty(tag)) {
                    missingList.push({ tag, name: config.name, exp: expVal, config: config });
                }
            }

            if (missingList.length > 0) {
                const missingHtml = missingList.map(item => {
                    let displayExp = (typeof item.exp === 'object') ? 'Container' : item.exp;
                    if(item.config && item.config.options && typeof item.exp !== 'object') {
                        const opt = item.config.options.find(o => o.value === item.exp);
                        if(opt) displayExp = opt.label;
                    }
                    return `
                        <tr class="comparison-missing-row">
                            <td class="tag-id">${item.tag}</td>
                            <td>${item.name}</td>
                            <td>-</td>
                            <td>-</td>
                            <td class="text-muted small">Missing from QR (Expected: ${displayExp})</td>
                            <td></td>
                            <td><span class="badge bg-danger">Missing</span></td>
                        </tr>
                    `;
                }).join('');
                tbody.insertAdjacentHTML('beforeend', missingHtml);
            }
        }
    }
</script>
</body>
</html>
